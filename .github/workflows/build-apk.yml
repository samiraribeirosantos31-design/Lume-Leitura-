name: Gerar APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: lume-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Verificar integração e avisos
        run: node --test tests/integracao.cjs
      - name: Identificar esta versão
        run: |
          python3 scripts/versao-build.py
      - run: npx cap add android
      - name: Preparar ícones e versão Android
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          bash scripts/icones.sh
          python3 scripts/versao-android.py
      - name: Preservar assinatura de teste entre builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lume-debug-signing-v1
      - name: Sincronizar arquivos do aplicativo
        run: |
          rm -f www/Lume-Leitura-novidades.zip
          npx cap sync android
      - name: Gerar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lume-leitura-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar para download
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Lume Leitura (versão mais recente)
          body_path: release-notes.txt
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
