<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lume Leitura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap">
<style>
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --surface-2:#E6EAF2;
  --ink:#141C33; --ink-2:#4A5471; --ink-3:#8E98B4; --line:#D8DEEA;
  --accent:#FFB400; --on-accent:#1A1300;
  --pet:#1F8F83; --pet-deep:#146259; --pet-belly:#CDEDE7; --pet-wash:#DCF1ED; --pet-text:#146259;
  --bad:#B3302F; --scrim:rgba(20,28,51,.45); --shadow:rgba(20,28,51,.14);
  --eye:#FFFFFF; --pupil:#141C33; --blush:#FF8FA3; --page:#FFFFFF;
  --font-display:'Bricolage Grotesque','Arial Rounded MT Bold',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0D1225; --surface:#161D36; --surface-2:#232C4B;
    --ink:#EBEFFA; --ink-2:#A8B1CE; --ink-3:#66719A; --line:#28315A;
    --accent:#FFC233; --on-accent:#1A1300;
    --pet:#3CC5B3; --pet-deep:#1E8B7E; --pet-belly:#D3F5EE; --pet-wash:#12302F; --pet-text:#5ED6C5;
    --bad:#FF8A88; --scrim:rgba(2,5,15,.62); --shadow:rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:16px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(8px + env(safe-area-inset-top,0px)); padding-bottom:112px;
}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;font-optical-sizing:auto}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pet);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:12px 0 16px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
h1{font-size:32px;line-height:1.05;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.icon-btn{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.fill{fill:currentColor;stroke:none}
#view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.sec{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-family:var(--font-body);margin-top:6px}
.muted{color:var(--ink-2);font-size:14px}
.pet-card{background:var(--pet-wash);border-radius:28px;padding:18px;display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;align-items:center}
.pet{width:132px}
.pet svg{display:block;width:100%;height:auto;overflow:visible}
.pet-card h2{font-size:28px;font-weight:800;line-height:1.05;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:2px}
.stage{font-family:var(--font-body);font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface);color:var(--pet-text)}
.mood{font-size:14px;color:var(--ink-2);margin:8px 0 12px}
.xp{height:8px;border-radius:99px;background:var(--surface);overflow:hidden}
.xp i{display:block;height:100%;background:var(--pet);border-radius:99px}
.xp-l{font-size:12px;color:var(--ink-2);margin-top:6px}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (max-width:359px){.pet-card{grid-template-columns:1fr;justify-items:center;text-align:center}.pet-card h2{justify-content:center}}
.goal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.ring-w{position:relative;width:120px;height:120px}
.ring-w svg{width:120px;height:120px;display:block}
.ring-t{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-t b{font-family:var(--font-display);font-size:36px;font-weight:800;line-height:1}
.ring-t span{font-size:12px;color:var(--ink-2)}
.stats{display:grid;gap:12px}
.stat{display:flex;align-items:center;gap:12px}
.stat+.stat{border-top:1px solid var(--line);padding-top:12px}
.stat .ic{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.stat b{display:block;font-family:var(--font-display);font-size:28px;line-height:1;font-weight:800}
.stat .l{font-size:13px;color:var(--ink-2)}
.chart-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.chart-h h2{font-size:18px;font-weight:700}
.plot{position:relative;height:124px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.col .v{font-size:11px;font-weight:600;color:var(--ink-2)}
.col .b{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--ink-3);min-height:3px}
.col .b.ok{background:var(--pet)}
.goal-line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink-3);pointer-events:none}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.days span{text-align:center;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.days span.t{color:var(--ink);font-weight:800}
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:1.5px solid transparent;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:none}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-ghost{border-color:var(--line);background:var(--surface)}
.btn-soft{background:var(--pet-wash);color:var(--pet-text)}
.btn-quiet{color:var(--ink-2);font-weight:600}
.btn-danger{background:var(--bad);color:var(--bg)}
.btn-block{width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px}
.shelf{display:flex;flex-direction:column}
.book{padding:16px 0;border-top:1px solid var(--line);display:grid;gap:10px}
.book:first-child{border-top:0;padding-top:0}
.book:last-child{padding-bottom:0}
.book-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.book h3{font-size:19px;font-weight:700;line-height:1.2}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--pet-wash);color:var(--pet-text);white-space:nowrap}
.pill.off{background:var(--surface-2);color:var(--ink-2)}
.track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;background:var(--pet);border-radius:99px}
.book-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}
.confirm{display:grid;gap:10px;font-size:14px}
.empty{text-align:center;display:grid;gap:12px;justify-items:center;padding:28px 16px}
.empty h2{font-size:20px}
.ach-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ach{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;align-content:start}
.ach-ic{width:40px;height:40px;border-radius:12px;background:var(--surface-2);color:var(--ink-3);display:grid;place-items:center}
.ach.on .ach-ic{background:var(--accent);color:var(--on-accent)}
.ach h3{font-size:16px;font-weight:700;line-height:1.2}
.ach p{font-size:13px;color:var(--ink-2)}
.ach .n{font-size:12px;font-weight:600;color:var(--ink-2)}
.ach.on .n{color:var(--pet-text)}
.ach:not(.on) h3{color:var(--ink-2)}
.demo{border:1.5px dashed var(--ink-3);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink-2);display:grid;gap:10px}
.demo .btn{min-height:40px;justify-self:start;padding:0 14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.tab{border:0;background:none;border-radius:12px;padding:6px 4px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink-2)}
.tab.on{color:var(--pet-text);background:var(--pet-wash)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50}
.sheet{position:fixed;z-index:51;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;
  background:var(--surface);border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;
  padding-top:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  animation:up .22s ease-out}
@keyframes up{from{transform:translate(-50%,24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.sheet h2{font-size:24px;font-weight:800;margin-bottom:14px}
.sheet label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}
.sheet input,.sheet select{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 14px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{min-height:40px;min-width:52px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.chip[aria-pressed="true"]{background:var(--pet);border-color:var(--pet);color:var(--bg)}
.hint{font-size:13px;color:var(--ink-2);margin-top:6px}
.preview{font-size:14px;font-weight:700;color:var(--pet-text);margin-top:12px;min-height:21px}
.err{font-size:14px;font-weight:600;color:var(--bad);min-height:20px;margin-top:6px}
.sheet .row{margin-top:10px}
.stepper{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:8px}
.stepper button{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;font-weight:700}
.stepper input{text-align:center}
.zone{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);display:grid;gap:10px;font-size:14px;color:var(--ink-2)}
#toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:40;
  width:max-content;max-width:min(92vw,420px);background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;
  font-size:14px;font-weight:600;display:grid;gap:2px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){
  .bob{animation:none}.sheet{animation:none}#toast{transition:none}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2.5c.6 3 4.2 5 4.2 9.6a4.2 4.2 0 0 1-8.4 0c0-1.6.6-2.8 1.5-3.8.2 1.1.8 1.8 1.6 2C10.7 7.6 10.9 5 12 2.5Z"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.8 5.9 6.2.8-4.6 4.3 1.2 6.3L12 17.3 6.4 20.3l1.2-6.3L3 9.7l6.2-.8L12 3Z"/></symbol>
  <symbol id="i-today" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-books" viewBox="0 0 24 24"><rect x="4" y="4" width="4.5" height="16" rx="1"/><rect x="10" y="4" width="4.5" height="16" rx="1"/><path d="M16 6.5l3.4-.9 3 12.9-3.4.9Z"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4Z"/><path d="M8 6H5v1.5A3 3 0 0 0 8 10.5"/><path d="M16 6h3v1.5a3 3 0 0 1-3 3"/><path d="M12 13v4"/><path d="M8.5 20h7"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.5C10.5 5 8 4.5 4.5 4.5V18c3.5 0 6 .5 7.5 2 1.5-1.5 4-2 7.5-2V4.5C16 4.5 13.5 5 12 6.5ZM12 6.5V20"/></symbol>
</svg>

<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="title">Hoje</h1>
    </div>
    <button class="icon-btn" data-act="settings" aria-label="Ajustes"><svg class="i" aria-hidden="true"><use href="#i-sliders"/></svg></button>
  </header>
  <main id="view" role="tabpanel"></main>
</div>

<nav class="tabs" aria-label="Seções">
  <div class="tabs-in" role="tablist">
    <button class="tab" role="tab" data-tab="today"><svg class="i" aria-hidden="true"><use href="#i-today"/></svg>Hoje</button>
    <button class="tab" role="tab" data-tab="books"><svg class="i" aria-hidden="true"><use href="#i-books"/></svg>Livros</button>
    <button class="tab" role="tab" data-tab="ach"><svg class="i" aria-hidden="true"><use href="#i-trophy"/></svg>Conquistas</button>
  </div>
</nav>

<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=n=>Number(n).toLocaleString('pt-BR');
const pl=(n,a,b)=>n===1?a:b;
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;};
const today=()=>dkey(new Date());
const uid=()=>Math.random().toString(36).slice(2,9);
const ic=(id,fill)=>'<svg class="i'+(fill?' fill':'')+'" aria-hidden="true"><use href="#'+id+'"/></svg>';

const KEY='lume-leitura-v1';
const STAGES=['Ovo','Filhote','Leitor','Sábio','Lendário'];
const CUTS=[0,30,200,600,1500];
let S=null, tab='today', ask=null, lastFocus=null, tt=null;

function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s&&s.v===1)return s;}}catch(e){}
  return null;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

function seed(){
  const now=new Date();
  const L=(back,bookId,min,pages,extra)=>({id:uid(),date:dkey(addDays(now,-back)),bookId:bookId,min:min,pages:pages,pts:min+pages+(extra||0)});
  return {v:1,goal:20,petName:'Tinta',demo:true,seen:null,
    books:[
      {id:'b1',title:'Dom Casmurro',author:'Machado de Assis',total:256,page:104,done:false},
      {id:'b2',title:'Iracema',author:'José de Alencar',total:160,page:160,done:true},
      {id:'b3',title:'Memórias Póstumas de Brás Cubas',author:'Machado de Assis',total:272,page:0,done:false}
    ],
    logs:[L(9,'b2',25,30,10),L(8,'b2',20,28,10),L(7,'b2',30,40,10),L(5,'b2',25,32,10),L(4,'b2',22,30,60),
          L(3,'b1',24,31,10),L(2,'b1',20,26,10),L(1,'b1',28,37,10),L(0,'b1',8,10,0)]};
}

const sum=(a,k)=>a.reduce((t,x)=>t+(x[k]||0),0);
const points=()=>sum(S.logs,'pts');
const minutesOn=k=>S.logs.reduce((t,l)=>l.date===k?t+l.min:t,0);
function stageOf(p){let s=0;for(let i=0;i<CUTS.length;i++){if(p>=CUTS[i])s=i;}return s;}
function streak(){
  let d=new Date();
  if(minutesOn(dkey(d))<S.goal)d=addDays(d,-1);
  let n=0;
  while(minutesOn(dkey(d))>=S.goal&&n<4000){n++;d=addDays(d,-1);}
  return n;
}
function longest(){
  const m={};S.logs.forEach(l=>{m[l.date]=(m[l.date]||0)+l.min;});
  const keys=Object.keys(m).filter(k=>m[k]>=S.goal).sort();
  let best=0,run=0,prev=null;
  keys.forEach(k=>{
    const d=new Date(k+'T12:00:00');
    if(prev&&Math.round((d-prev)/864e5)===1)run++;else run=1;
    if(run>best)best=run;prev=d;
  });
  return best;
}
function achs(){
  const m=sum(S.logs,'min'),pg=sum(S.logs,'pages'),done=S.books.filter(b=>b.done).length,ls=longest(),pts=points();
  const list=[
    {id:'first',icon:'i-book',name:'Primeira leitura',desc:'Registre sua primeira leitura.',cur:Math.min(S.logs.length,1),t:1},
    {id:'s3',icon:'i-flame',name:'Três dias firmes',desc:'Bata a meta 3 dias seguidos.',cur:ls,t:3},
    {id:'s7',icon:'i-flame',name:'Semana inteira',desc:'Bata a meta 7 dias seguidos.',cur:ls,t:7},
    {id:'s30',icon:'i-flame',name:'Mês de leitura',desc:'Bata a meta 30 dias seguidos.',cur:ls,t:30},
    {id:'m100',icon:'i-today',name:'100 minutos',desc:'Some 100 minutos de leitura.',cur:m,t:100},
    {id:'m1000',icon:'i-today',name:'Mil minutos',desc:'Some 1.000 minutos de leitura.',cur:m,t:1000},
    {id:'p100',icon:'i-book',name:'100 páginas',desc:'Leia 100 páginas no total.',cur:pg,t:100},
    {id:'p1000',icon:'i-book',name:'1.000 páginas',desc:'Leia 1.000 páginas no total.',cur:pg,t:1000},
    {id:'b1',icon:'i-check',name:'Primeiro livro',desc:'Termine um livro.',cur:done,t:1},
    {id:'b5',icon:'i-books',name:'Estante cheia',desc:'Termine 5 livros.',cur:done,t:5},
    {id:'pet3',icon:'i-star',name:'Sábio da estante',desc:'Leve '+S.petName+' ao estágio Sábio.',cur:pts,t:CUTS[3]}
  ];
  return list.map(a=>({id:a.id,icon:a.icon,name:a.name,desc:a.desc,t:a.t,ok:a.cur>=a.t,cur:Math.min(a.cur,a.t)}));
}
const unlockedIds=()=>achs().filter(a=>a.ok).map(a=>a.id);

function pet(stage,mood){
  const sp=(x,y,s)=>'<path d="M0-9Q0 0 9 0Q0 0 0 9Q0 0-9 0Q0 0 0-9Z" transform="translate('+x+' '+y+') scale('+s+')" fill="var(--accent)"/>';
  let o='<svg viewBox="0 0 200 200" role="img" aria-label="'+esc(S.petName)+', estágio '+STAGES[stage]+'">';
  if(stage===0){
    o+='<g class="bob"><ellipse cx="100" cy="180" rx="44" ry="8" fill="var(--shadow)"/>'
